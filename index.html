<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>大相撲ブラザーズ ～ SUMO BROS.</title>
<style>
  :root{
    --ink:#1b1430;
    --amber:#f6b32b;
    --amber-d:#c8861a;
    --crimson:#d23b2e;
    --paper:#f7f1e3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #3a2566 0%, #221842 45%, #140e2a 100%);
    color:var(--paper);
    font-family:"Courier New",monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;
    padding:14px;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .title{
    text-align:center;line-height:1;margin-bottom:10px;
  }
  .title h1{
    margin:0;font-size:clamp(22px,5vw,40px);font-weight:900;letter-spacing:2px;
    color:var(--paper);
    text-shadow:
      3px 3px 0 var(--crimson),
      6px 6px 0 #6b1410,
      0 0 18px rgba(246,179,43,.35);
  }
  .title .sub{
    font-size:clamp(10px,2vw,13px);letter-spacing:6px;color:var(--amber);
    margin-top:6px;font-weight:700;
  }
  /* cabinet / TV bezel */
  .cabinet{
    position:relative;
    padding:16px;
    background:linear-gradient(180deg,#2b2050,#1a1338);
    border-radius:18px;
    box-shadow:
      0 0 0 2px #0c0820,
      0 18px 0 -2px #0c0820,
      0 20px 40px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.08);
  }
  .cabinet:before{
    content:"● ● ●";
    position:absolute;top:-2px;right:16px;color:var(--amber-d);
    font-size:8px;letter-spacing:4px;opacity:.7;
  }
  .screen{
    position:relative;
    width:min(86vw, 768px);
    aspect-ratio:256/224;
    background:#0a0d18;
    border-radius:8px;
    overflow:hidden;
    box-shadow:inset 0 0 0 3px #000, inset 0 0 30px rgba(0,0,0,.6);
  }
  canvas{
    position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
    display:block;
  }
  /* CRT overlay */
  .crt{
    position:absolute;inset:0;pointer-events:none;z-index:5;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, rgba(0,0,0,0) 2px 4px);
    mix-blend-mode:multiply;
  }
  .vig{position:absolute;inset:0;pointer-events:none;z-index:5;
    box-shadow:inset 0 0 60px rgba(0,0,0,.55);border-radius:8px;}

  /* HUD */
  .hud{
    position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;
    display:flex;justify-content:space-between;gap:8px;
    padding:6px 9px;font-weight:900;letter-spacing:1px;
    font-size:clamp(9px,1.8vw,14px);
    color:#fff;text-shadow:2px 2px 0 #000;
  }
  .hud .lab{color:var(--amber);font-size:.72em;letter-spacing:2px;}
  .hud .grp{display:flex;flex-direction:column;line-height:1.15;}
  .hud .right{align-items:flex-end;}
  .hud .mid{align-items:center;}

  /* overlays (menus) */
  .overlay{
    position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:14px;
    padding:18px;
    background:rgba(8,6,20,.72);
    backdrop-filter:blur(1px);
  }
  .overlay.hidden{display:none;}
  .overlay h2{
    margin:0;font-size:clamp(20px,4.4vw,34px);font-weight:900;letter-spacing:2px;
    color:#fff;text-shadow:3px 3px 0 var(--crimson),0 0 16px rgba(246,179,43,.4);
  }
  .overlay p{margin:0;font-size:clamp(11px,2.2vw,15px);color:var(--paper);opacity:.92;}
  .blink{animation:bl 1s steps(2,end) infinite;color:var(--amber);font-weight:900;
    font-size:clamp(12px,2.6vw,18px);letter-spacing:2px;}
  @keyframes bl{50%{opacity:0;}}
  .btn{
    pointer-events:auto;cursor:pointer;
    font-family:inherit;font-weight:900;letter-spacing:2px;
    color:#1a1338;background:var(--amber);
    border:none;border-radius:6px;padding:10px 18px;font-size:14px;
    box-shadow:0 4px 0 var(--amber-d), 0 8px 14px rgba(0,0,0,.4);
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amber-d);}

  .help{
    margin-top:12px;font-size:clamp(9px,1.9vw,12px);color:#cdbdf0;letter-spacing:1px;
    text-align:center;line-height:1.6;max-width:768px;
  }
  .help b{color:var(--amber);}
  kbd{background:#3a2d63;border-radius:4px;padding:1px 6px;border:1px solid #56468a;
     color:#fff;font-family:inherit;font-size:.92em;}

  /* touch controls */
  .touch{
    position:absolute;inset:0;z-index:7;pointer-events:none;
    display:none;justify-content:space-between;align-items:flex-end;
    padding:10px;
  }
  .touch.on{display:flex;}
  .pad{display:flex;gap:10px;pointer-events:auto;}
  .tbtn{
    width:54px;height:54px;border-radius:50%;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);
    color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(2px);
  }
  .tbtn:active{background:rgba(246,179,43,.6);}
  .tbtn.big{width:62px;height:62px;}
  @media (max-width:560px){ .help{display:none;} }
</style>
</head>
<body>
  <div class="title">
    <h1>大相撲ブラザーズ</h1>
    <div class="sub">S U M O &nbsp; B R O S .</div>
  </div>

  <div class="cabinet">
    <div class="screen">
      <canvas id="game" width="256" height="224"></canvas>

      <div class="hud" id="hud">
        <div class="grp"><span class="lab">スコア</span><span id="hScore">000000</span></div>
        <div class="grp mid"><span class="lab">塩 ×</span><span id="hCoins">00</span></div>
        <div class="grp mid"><span class="lab">本場所</span><span id="hStage">1-1</span></div>
        <div class="grp right"><span class="lab">のこり</span><span id="hLives">×3</span></div>
        <div class="grp right"><span class="lab">タイム</span><span id="hTime">300</span></div>
      </div>

      <div class="crt"></div>
      <div class="vig"></div>

      <!-- touch -->
      <div class="touch" id="touch">
        <div class="pad">
          <div class="tbtn" data-k="left">◀</div>
          <div class="tbtn" data-k="right">▶</div>
        </div>
        <div class="pad">
          <div class="tbtn big" data-k="dash">突</div>
          <div class="tbtn big" data-k="jump">跳</div>
        </div>
      </div>

      <!-- TITLE -->
      <div class="overlay" id="ovTitle">
        <h2>大相撲ブラザーズ</h2>
        <p>力士「あんこ丸」が さらわれた化粧まわしを取り返す旅へ！</p>
        <p style="opacity:.8">踏んづけ ＆ 必殺「ぶちかまし」で 突き進め</p>
        <button class="btn" id="btnStart">はっけよい！ スタート</button>
        <div class="blink">PRESS ENTER</div>
      </div>

      <!-- GAME OVER -->
      <div class="overlay hidden" id="ovOver">
        <h2 style="color:#ff8a7a">負け越し…</h2>
        <p id="overScore">スコア 000000</p>
        <button class="btn" id="btnRetry">もう一番！</button>
      </div>

      <!-- WIN -->
      <div class="overlay hidden" id="ovWin">
        <h2 style="color:var(--amber)">優 勝 ！</h2>
        <p id="winScore">スコア 000000</p>
        <p style="opacity:.85">化粧まわしを取り返した！</p>
        <button class="btn" id="btnNext">もう一度 取組する</button>
      </div>
    </div>
  </div>

  <div class="help">
    <b>移動</b> <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd>　
    <b>ジャンプ</b> <kbd>Space</kbd>/<kbd>↑</kbd>/<kbd>W</kbd>　
    <b>ぶちかまし</b> <kbd>Shift</kbd>/<kbd>X</kbd>　
    <b>ミュート</b> <kbd>M</kbd>　
    <b>決定</b> <kbd>Enter</kbd>
  </div>

<script>
"use strict";
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const VW = 256, VH = 224, TILE = 16;

  // ---------- palette ----------
  const C = {
    skin:'#f4c89a', skinSh:'#d39b6c', dark:'#2b1d14', white:'#f7f1e3',
    eye:'#1a120c', blush:'#e8896b',
    belt:'#cf3b2e', beltSh:'#9c2a20',
    enBelt:'#2f4ea0', enBeltSh:'#21356f', enSkin:'#e7b07e', enSkinSh:'#c08a59',
    gold:'#f6c945', goldSh:'#c8941d', goldHi:'#fde9a6',
    rope:'#f3ead3',
  };

  // ---------- input ----------
  const keys = {};
  const KMAP = {
    ArrowLeft:'left', KeyA:'left',
    ArrowRight:'right', KeyD:'right',
    ArrowUp:'jump', KeyW:'jump', Space:'jump',
    ShiftLeft:'dash', ShiftRight:'dash', KeyX:'dash', KeyZ:'dash',
    KeyM:'mute', Enter:'enter'
  };
  addEventListener('keydown', e=>{
    const a = KMAP[e.code];
    if(a){
      if(['left','right','jump','dash'].includes(a)) e.preventDefault();
      if(!e.repeat) handlePress(a);
      keys[a]=true;
    }
  });
  addEventListener('keyup', e=>{ const a=KMAP[e.code]; if(a) keys[a]=false; });

  function handlePress(a){
    ensureAudio();
    if(a==='mute'){ toggleMute(); return; }
    if(a==='enter'){
      if(state==='title') startGame();
      else if(state==='over') startGame();
      else if(state==='win') startGame();
      return;
    }
    if(a==='jump' && state==='play') tryJump();
    if(a==='dash' && state==='play') tryDash();
  }

  // touch
  const touchEl = document.getElementById('touch');
  if (('ontouchstart' in window) || navigator.maxTouchPoints>0){ touchEl.classList.add('on'); }
  touchEl.querySelectorAll('[data-k]').forEach(el=>{
    const a = el.dataset.k;
    const dn = e=>{ e.preventDefault(); keys[a]=true; handlePress(a); };
    const up = e=>{ e.preventDefault(); keys[a]=false; };
    el.addEventListener('touchstart',dn,{passive:false});
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('touchcancel',up,{passive:false});
    el.addEventListener('mousedown',dn);
    el.addEventListener('mouseup',up);
    el.addEventListener('mouseleave',up);
  });

  // ---------- audio (tiny synth) ----------
  let actx=null, master=null, muted=false, musicTimer=null;
  function ensureAudio(){
    if(actx) { if(actx.state==='suspended') actx.resume(); return; }
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    }catch(e){ actx=null; }
  }
  function toggleMute(){
    muted=!muted;
    if(master) master.gain.value = muted?0:0.5;
  }
  function beep(freq, dur, type='square', vol=0.18, glideTo=null, when=0){
    if(!actx||muted) return;
    const t0 = actx.currentTime + when;
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }
  const sfx = {
    jump(){ beep(330,0.16,'square',0.16,640); },
    coin(){ beep(988,0.06,'square',0.16); beep(1319,0.10,'square',0.16,null,0.06); },
    stomp(){ beep(180,0.12,'square',0.2,90); },
    dash(){ beep(140,0.16,'sawtooth',0.18,420); },
    power(){ [523,659,784,1047].forEach((f,i)=>beep(f,0.1,'square',0.16,null,i*0.07)); },
    hurt(){ beep(440,0.25,'sawtooth',0.2,110); },
    die(){ [392,330,262,196].forEach((f,i)=>beep(f,0.18,'triangle',0.2,null,i*0.12)); },
    win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,0.14,'square',0.16,null,i*0.13)); },
    bump(){ beep(150,0.07,'square',0.16); },
    brick(){ beep(120,0.09,'square',0.18,70); },
  };
  // background music loop
  const MEL = [ // [freq, beats]
    [523,1],[659,1],[784,1],[659,1],[523,1],[440,1],[523,2],
    [587,1],[698,1],[880,1],[698,1],[587,1],[523,2],[392,2],
    [440,1],[523,1],[659,1],[523,1],[440,1],[392,1],[440,2],
    [523,1],[440,1],[392,1],[330,1],[392,2],[523,2]
  ];
  const BASS = [262,196,262,196,294,196,262,196];
  function startMusic(){
    if(!actx) return;
    stopMusic();
    const beat=0.16;
    const schedule = ()=>{
      if(muted){ musicTimer=setTimeout(schedule, 300); return; }
      let t=0;
      for(const [f,b] of MEL){
        beep(f, beat*b*0.9, 'square', 0.07, null, t);
        t += beat*b;
      }
      let bt=0; const loopLen=t;
      while(bt < loopLen){ beep(BASS[Math.floor(bt/(beat*2))%BASS.length], beat*1.6,'triangle',0.10,null,bt); bt+=beat*2; }
      musicTimer = setTimeout(schedule, loopLen*1000);
    };
    schedule();
  }
  function stopMusic(){ if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; } }

  // ---------- level ----------
  const LW = 214, LH = 14;
  let grid; // [y][x] char
  let enemySpawns, coinMarks, qBlocks, goalX;

  function buildLevel(){
    grid = [];
    for(let y=0;y<LH;y++){ grid.push(new Array(LW).fill(' ')); }
    // ground rows 12,13
    for(let x=0;x<LW;x++){ grid[12][x]='X'; grid[13][x]='X'; }
    // pits
    const gaps=[[26,3],[42,2],[60,3],[95,3],[124,2],[154,4],[182,2]];
    for(const [gx,gw] of gaps){ for(let x=gx;x<gx+gw;x++){ grid[12][x]=' '; grid[13][x]=' '; } }

    const set=(x,y,t)=>{ if(x>=0&&x<LW&&y>=0&&y<LH) grid[y][x]=t; };

    // early ? blocks and bricks
    set(9,8,'?'); set(12,8,'?P'.charAt(0)); // placeholder, real powerup tracked below
    set(12,8,'?'); set(15,8,'?');
    set(13,8,'B'); set(14,8,'B');
    // a brick staircase-ish
    set(35,8,'B'); set(36,8,'B'); set(37,8,'?'); set(38,8,'B');

    // floating wood platforms over big gap at 95
    for(let x=94;x<=99;x++) set(x,8,'=');
    set(96,5,'?');

    // coins arc helper
    const arc=(cx,top,n)=>{ for(let i=0;i<n;i++){ set(cx+i, top - Math.round(Math.sin((i+1)/(n+1)*Math.PI)*2), 'o'); } };
    arc(27,9,4); arc(43,9,3); arc(61,9,4); arc(95,7,4); arc(155,8,5);

    // mid bricks cluster
    for(let x=110;x<=115;x++) set(x,8, (x%2?'B':'?'==='?'&&x===112?'?':'B'));
    set(110,8,'B'); set(111,8,'?'); set(112,8,'B'); set(113,8,'B'); set(114,8,'?'); set(115,8,'B');

    // platform bridge over gap 154 (4 wide) -> stepping blocks
    set(153,9,'='); set(155,8,'='); set(157,9,'=');

    // staircase up before goal (classic ascending then descending)
    let base=192;
    for(let i=0;i<4;i++){ for(let j=0;j<=i;j++){ set(base+i, 11-j, 'H'); } }
    base=198;
    for(let i=0;i<4;i++){ for(let j=0;j<(4-i);j++){ set(base+i, 11-j, 'H'); } }

    // some hard blocks and coins around stairs
    set(120,8,'B'); set(121,8,'B'); set(122,8,'B');

    // hidden high coins
    arc(70,6,3); arc(128,6,3);

    // goal
    goalX = 208;
    // ensure solid ground near goal
    for(let x=204;x<LW;x++){ grid[12][x]='X'; grid[13][x]='X'; }

    // collect markers
    enemySpawns = [19,31,47,55,66,82,101,112,113,131,146,150,168,186,200];
    qBlocks = {}; // "x,y" -> 'coin' | 'power'
    coinMarks = [];
    for(let y=0;y<LH;y++) for(let x=0;x<LW;x++){
      const t=grid[y][x];
      if(t==='o'){ coinMarks.push({x,y}); grid[y][x]=' '; }
      if(t==='?'){ qBlocks[x+','+y]='coin'; }
    }
    // designate a couple of ? as power-ups (ちゃんこ)
    qBlocks['12,8']='power';
    qBlocks['96,5']='power';
  }

  function solid(tx,ty){
    if(tx<0||tx>=LW) return true; // walls at edges
    if(ty<0) return false;
    if(ty>=LH) return false;
    const t=grid[ty][tx];
    return t==='X'||t==='B'||t==='?'||t==='H'||t==='U'||t==='=';
  }

  // ---------- entities ----------
  let player, enemies, coins, items, particles, bumps, brokenDebris;
  let camX=0, state='title', stageTime, timeAcc, score, lives, coinCount, winFlash;

  function makePlayer(){
    return {
      x: 2*TILE, y: 9*TILE, w:11, h:15, vx:0, vy:0,
      onGround:false, dir:1, big:false, invuln:0,
      dashT:0, dashCd:0, walk:0, blink:0, dead:false, deadT:0, win:false
    };
  }

  function resetWorld(full){
    buildLevel();
    player = makePlayer();
    enemies=[]; coins=[]; items=[]; particles=[]; bumps=[]; brokenDebris=[];
    for(const ex of enemySpawns){
      enemies.push({x:ex*TILE, y:11*TILE-12, w:12, h:12, vx:-0.45, vy:0, dir:-1, onGround:false, alive:true, squash:0});
    }
    for(const m of coinMarks){ coins.push({x:m.x*TILE+4, y:m.y*TILE+2, base:m.y*TILE+2, anim:Math.random()*6.28, taken:false}); }
    camX=0; stageTime=300; timeAcc=0; winFlash=0;
    if(full){ score=0; lives=3; coinCount=0; }
  }

  function startGame(){
    ensureAudio();
    resetWorld(true);
    state='play';
    show('ovTitle',false); show('ovOver',false); show('ovWin',false);
    startMusic();
  }

  // ---------- mechanics ----------
  function tryJump(){
    if(player.onGround && !player.dead){
      player.vy = player.big? -9.0 : -8.4;
      player.onGround=false; sfx.jump();
    }
  }
  function tryDash(){
    if(player.dashCd<=0 && !player.dead){
      player.dashT = 14; player.dashCd = 34;
      player.vx = player.dir * 3.7;
      sfx.dash();
      for(let i=0;i<5;i++) spawnDust(player.x+(player.dir<0?player.w:0), player.y+player.h-3, -player.dir);
    }
  }

  function spawnDust(x,y,dx){
    particles.push({x,y,vx:dx*(0.3+Math.random()*0.6),vy:-Math.random()*0.6,life:18,col:'#e9dcc0',sz:2});
  }
  function spawnDebris(x,y){
    for(let i=0;i<4;i++) brokenDebris.push({x:x+ (i%2?8:0), y:y+(i<2?0:8), vx:(i%2?1.3:-1.3), vy:-3.2-Math.random(), life:60});
  }
  function spawnPoof(x,y,col){
    for(let i=0;i<8;i++){ const a=Math.random()*6.28; particles.push({x,y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4-0.6,life:24,col,sz:2}); }
  }

  function addScore(n){ score+=n; if(score>999999) score=999999; }

  function bumpBlock(tx,ty){
    const key=tx+','+ty;
    bumps.push({tx,ty,t:10});
    const t=grid[ty][tx];
    if(t==='?'){
      const kind=qBlocks[key]||'coin';
      grid[ty][tx]='U';
      if(kind==='power'){
        items.push({x:tx*TILE+2, y:ty*TILE-14, w:12,h:12, vy:-1.6, type:'pot', t:0});
        sfx.power();
      } else {
        // pop coin
        coins.push({x:tx*TILE+4,y:ty*TILE-6,base:ty*TILE,anim:0,taken:false,pop:18});
        addScore(200); coinCount++; sfx.coin();
      }
    } else if(t==='B'){
      if(player.big){ grid[ty][tx]=' '; spawnDebris(tx*TILE,ty*TILE); addScore(50); sfx.brick(); }
      else sfx.bump();
    } else {
      sfx.bump();
    }
  }

  // AABB tile collision resolution
  function moveX(e){
    e.x += e.vx;
    const top=Math.floor(e.y/TILE), bot=Math.floor((e.y+e.h-1)/TILE);
    if(e.vx>0){
      const tx=Math.floor((e.x+e.w-1)/TILE);
      for(let ty=top;ty<=bot;ty++) if(solid(tx,ty)){ e.x=tx*TILE-e.w; e.vx=0; return true; }
    } else if(e.vx<0){
      const tx=Math.floor(e.x/TILE);
      for(let ty=top;ty<=bot;ty++) if(solid(tx,ty)){ e.x=(tx+1)*TILE; e.vx=0; return true; }
    }
    return false;
  }
  function moveY(e){
    e.y += e.vy;
    const left=Math.floor(e.x/TILE), right=Math.floor((e.x+e.w-1)/TILE);
    if(e.vy>0){
      const ty=Math.floor((e.y+e.h-1)/TILE);
      for(let tx=left;tx<=right;tx++) if(solid(tx,ty)){ e.y=ty*TILE-e.h; e.vy=0; e.onGround=true; return 'down'; }
    } else if(e.vy<0){
      const ty=Math.floor(e.y/TILE);
      for(let tx=left;tx<=right;tx++) if(solid(tx,ty)){ e.y=(ty+1)*TILE; e.vy=0; return {hit:'up',tx,ty}; }
    }
    return null;
  }

  function updatePlayer(){
    const p=player;
    if(p.dead){
      p.vy += 0.5; p.y += p.vy; p.deadT--;
      if(p.deadT<=0){ afterDeath(); }
      return;
    }
    if(p.win){
      // walk to the right a little
      p.vx = 1.2; p.x += p.vx; p.walk+=0.3;
      p.onGround=false; p.vy+=0.5; moveY(p);
      return;
    }

    // horizontal control
    const ax=0.45, maxRun=2.2, fr=0.22;
    if(p.dashT>0){
      // dash overrides accel
      p.dashT--;
    } else {
      if(keys.left){ p.vx -= ax; p.dir=-1; }
      else if(keys.right){ p.vx += ax; p.dir=1; }
      else { if(p.vx>0){ p.vx=Math.max(0,p.vx-fr);} else if(p.vx<0){ p.vx=Math.min(0,p.vx+fr);} }
      const mx = p.big?maxRun+0.3:maxRun;
      if(p.vx>mx) p.vx=mx; if(p.vx<-mx) p.vx=-mx;
    }
    if(p.dashCd>0) p.dashCd--;

    // gravity
    p.vy += 0.5; if(p.vy>8) p.vy=8;

    p.onGround=false;
    moveX(p);
    const r = moveY(p);
    if(r && r.hit==='up'){
      // bump the block the head actually hit (r.ty), preferring ? or B
      const by = r.ty;
      const lx = Math.floor((p.x+1)/TILE), rx = Math.floor((p.x+p.w-2)/TILE);
      let target = -1;
      for(let tx=lx;tx<=rx;tx++){
        const t = grid[by] ? grid[by][tx] : ' ';
        if(t==='?'||t==='B'){ target=tx; break; }
        if(target<0 && solid(tx,by)) target=tx;
      }
      if(target>=0) bumpBlock(target, by);
    }

    // walk anim
    if(p.onGround && Math.abs(p.vx)>0.4) p.walk += Math.abs(p.vx)*0.12; else p.walk*=0.8;
    p.blink = (p.blink+1)%160;

    if(p.invuln>0) p.invuln--;

    // fell in pit
    if(p.y > LH*TILE + 20){ killPlayer(true); }

    // reach goal
    if(p.x + p.w/2 >= goalX*TILE){ winLevel(); }
  }

  function updateEnemies(){
    for(const e of enemies){
      if(!e.alive){ if(e.squash>0){ e.squash--; } continue; }
      e.vy += 0.5; if(e.vy>8) e.vy=8;
      e.onGround=false;
      e.vx = e.dir*0.5;
      if(moveX(e)) e.dir*=-1;
      moveY(e);
      // ledge turn
      if(e.onGround){
        const footTx = Math.floor((e.x + (e.dir>0? e.w+1 : -1))/TILE);
        const footTy = Math.floor((e.y+e.h+1)/TILE);
        if(!solid(footTx,footTy)) e.dir*=-1;
      }
      // off-screen culling not needed
      // collision with player
      const p=player;
      if(!p.dead && !p.win && overlap(p,e)){
        const falling = p.vy>1.2 && (p.y+p.h - e.y) < 10;
        if(falling){
          e.alive=false; e.squash=22; p.vy=-5.4; addScore(150); sfx.stomp();
          spawnPoof(e.x+e.w/2,e.y+e.h/2,'#dcdcff');
        } else if(p.dashT>0){
          e.alive=false; e.squash=0; addScore(200); sfx.stomp();
          spawnPoof(e.x+e.w/2,e.y+e.h/2,'#ffd27a');
          // launch it
          e.vy=-4; e.vx=p.dir*2.2; e.fly=true;
        } else if(p.invuln<=0){
          if(p.big){ shrink(p); }
          else killPlayer(false);
        }
      }
    }
    // flying defeated enemies fall away
    for(const e of enemies){ if(!e.alive && e.fly){ e.vy+=0.5; e.x+=e.vx; e.y+=e.vy; } }
  }

  function updateItems(){
    for(const it of items){
      it.t++;
      if(it.type==='pot'){
        it.vy = it.vy||0; it.vy+=0.4; if(it.vy>4) it.vy=4;
        // simple rise then settle: emerge upward first frames
        if(it.t<10){ it.y-=1.2; }
        else { it.y+=it.vy; const ty=Math.floor((it.y+it.h)/TILE); const lx=Math.floor(it.x/TILE), rx=Math.floor((it.x+it.w)/TILE);
          let hit=false; for(let tx=lx;tx<=rx;tx++) if(solid(tx,ty)){ it.y=ty*TILE-it.h; it.vy=0; hit=true; } 
          if(hit) it.x += 0.6; }
        const p=player;
        if(!p.dead && overlap(p,it)){ it.dead=true; grow(p); sfx.power(); addScore(1000); spawnPoof(p.x+p.w/2,p.y,'#ffd27a'); }
      }
    }
    items = items.filter(i=>!i.dead);
  }

  function updateCoins(){
    for(const c of coins){
      if(c.taken) continue;
      c.anim += 0.18;
      if(c.pop!==undefined){ c.pop--; c.y -= 1.4; if(c.pop<=0) c.taken=true; continue; }
      const p=player;
      if(!p.dead && overlap(p,{x:c.x-2,y:c.y-2,w:12,h:16})){
        c.taken=true; addScore(200); coinCount++; sfx.coin();
        if(coinCount>0 && coinCount%50===0){ lives++; sfx.power(); }
      }
    }
  }

  function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

  function grow(p){ if(!p.big){ p.big=true; p.w=15; p.h=24; p.y-=8; p.invuln=40; } }
  function shrink(p){ p.big=false; p.w=11; p.h=15; p.y+=8; p.invuln=90; sfx.hurt(); }

  function killPlayer(pit){
    if(player.dead) return;
    player.dead=true; player.deadT=70; player.vy=pit?2:-7; player.vx=0;
    stopMusic(); sfx.die();
  }
  function afterDeath(){
    lives--;
    if(lives<=0){ gameOver(); }
    else { // respawn
      const sc=score, lv=lives, cc=coinCount;
      resetWorld(false); score=sc; lives=lv; coinCount=cc; state='play'; startMusic();
    }
  }
  function gameOver(){
    state='over'; stopMusic();
    document.getElementById('overScore').textContent='スコア '+pad(score,6);
    show('ovOver',true);
  }
  function winLevel(){
    if(player.win) return;
    player.win=true; player.invuln=999; stopMusic(); sfx.win();
    winFlash=1;
    // time bonus
    addScore(stageTime*10);
    setTimeout(()=>{
      state='win';
      document.getElementById('winScore').textContent='スコア '+pad(score,6);
      show('ovWin',true);
    }, 2200);
  }

  // ---------- rendering ----------
  function clearTop(){ camX = Math.max(0, Math.min(player.x - VW/2 + 8, LW*TILE - VW)); }

  function drawBG(){
    // sky gradient
    const g=ctx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#7fc7f5'); g.addColorStop(0.6,'#bfe6ff'); g.addColorStop(1,'#e9f7ff');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

    // sun
    ctx.fillStyle='#fff4cf'; ctx.beginPath(); ctx.arc(210,40,16,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(255,244,207,.4)'; ctx.beginPath(); ctx.arc(210,40,24,0,6.28); ctx.fill();

    // Mt Fuji (parallax 0.25)
    const fx = -camX*0.25;
    for(const mx of [60, 360]){
      const bx = mx+fx; 
      ctx.fillStyle='#9fb4e6';
      ctx.beginPath(); ctx.moveTo(bx-70,170); ctx.lineTo(bx,70); ctx.lineTo(bx+70,170); ctx.closePath(); ctx.fill();
      // snow cap
      ctx.fillStyle='#f4f8ff';
      ctx.beginPath(); ctx.moveTo(bx-22,100); ctx.lineTo(bx,70); ctx.lineTo(bx+22,100);
      ctx.lineTo(bx+12,98); ctx.lineTo(bx+6,104); ctx.lineTo(bx-2,97); ctx.lineTo(bx-10,104); ctx.lineTo(bx-16,98); ctx.closePath(); ctx.fill();
    }

    // hills (parallax 0.5)
    const hx=-camX*0.5;
    ctx.fillStyle='#7cc46a';
    for(let i=-1;i<8;i++){ const cx=hx + i*120 + 60; ctx.beginPath(); ctx.arc(cx,200,80,Math.PI,0); ctx.fill(); }
    ctx.fillStyle='#67b257';
    for(let i=-1;i<10;i++){ const cx=hx*1.05 + i*90 + 20; ctx.beginPath(); ctx.arc(cx,210,55,Math.PI,0); ctx.fill(); }

    // clouds (parallax 0.4)
    const cx0=-camX*0.4;
    ctx.fillStyle='#ffffff';
    const clouds=[[40,34],[150,52],[260,30],[330,60],[120,90]];
    for(const [x,y] of clouds){ const X=((x+cx0)%420+420)%420 - 30; cloud(X,y); }

    // cherry trees (world parallax ~0.8) drawn behind tiles
    const tx=-camX*0.85;
    for(const wx of [18,90,170,250,330,410]){ tree(wx+tx, 196); }
  }
  function cloud(x,y){ ctx.beginPath(); ctx.arc(x,y,10,0,6.28); ctx.arc(x+12,y+3,12,0,6.28); ctx.arc(x+26,y,9,0,6.28); ctx.fill(); }
  function tree(x,baseY){
    ctx.fillStyle='#7a4a25'; ctx.fillRect(x-3,baseY-26,6,26);
    ctx.fillStyle='#f6a8c8';
    ctx.beginPath(); ctx.arc(x,baseY-34,14,0,6.28); ctx.arc(x-12,baseY-26,11,0,6.28); ctx.arc(x+12,baseY-26,11,0,6.28); ctx.arc(x,baseY-22,12,0,6.28); ctx.fill();
    ctx.fillStyle='#ffc6dc';
    ctx.beginPath(); ctx.arc(x-4,baseY-36,6,0,6.28); ctx.arc(x+8,baseY-28,5,0,6.28); ctx.fill();
  }

  // falling petals
  let petals=[];
  for(let i=0;i<14;i++) petals.push({x:Math.random()*VW,y:Math.random()*VH,s:Math.random()*0.4+0.2,ph:Math.random()*6.28});
  function drawPetals(){
    ctx.fillStyle='#ffd4e4';
    for(const p of petals){
      p.y += p.s+0.2; p.ph+=0.05; p.x += Math.sin(p.ph)*0.4;
      if(p.y>VH){ p.y=-4; p.x=Math.random()*VW; }
      ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2);
    }
  }

  function pr(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

  function drawTile(t,sx,sy,tx,ty,off){
    sy+=off;
    if(t==='X'){
      const grassTop = (ty>0 && grid[ty-1][tx]!=='X');
      pr(sx,sy,16,16,'#8a5a2b');
      pr(sx,sy+12,16,4,'#724628');
      // speckles
      pr(sx+3,sy+8,2,2,'#704427'); pr(sx+10,sy+10,2,2,'#9a663a'); pr(sx+7,sy+4,2,2,'#7a4d2b');
      if(grassTop){ pr(sx,sy,16,5,'#5bb24a'); pr(sx,sy+4,16,2,'#3f8c36');
        pr(sx+2,sy-1,2,2,'#6cc758'); pr(sx+9,sy-1,2,2,'#6cc758'); }
      pr(sx,sy,16,1,'rgba(255,255,255,.12)');
    } else if(t==='B'){
      pr(sx,sy,16,16,'#b5562b'); pr(sx,sy,16,1,'#d6794a'); 
      pr(sx,sy+7,16,2,'#7d3a1c');
      pr(sx+7,sy,2,7,'#7d3a1c'); pr(sx+3,sy+9,2,7,'#7d3a1c'); pr(sx+11,sy+9,2,7,'#7d3a1c');
    } else if(t==='?'||t==='U'){
      if(t==='U'){ pr(sx,sy,16,16,'#9a6a3a'); pr(sx,sy,16,2,'#b98a55'); pr(sx,sy+14,16,2,'#6d4a26'); }
      else {
        pr(sx,sy,16,16,'#e6a817'); pr(sx,sy,16,2,'#ffd766'); pr(sx,sy+13,16,3,'#b97f12');
        pr(sx,sy,2,16,'#ffd766'); pr(sx+14,sy,2,16,'#b97f12');
        // rivets
        pr(sx+2,sy+2,2,2,'#7a5208'); pr(sx+12,sy+2,2,2,'#7a5208'); pr(sx+2,sy+12,2,2,'#7a5208'); pr(sx+12,sy+12,2,2,'#7a5208');
        // "?"
        const q='#fff';
        pr(sx+5,sy+4,5,2,q); pr(sx+9,sy+4,2,3,q); pr(sx+7,sy+7,3,2,q); pr(sx+7,sy+9,2,2,q); pr(sx+7,sy+12,2,2,q);
      }
    } else if(t==='H'){
      pr(sx,sy,16,16,'#9aa0ac'); pr(sx,sy,16,2,'#c2c6cf'); pr(sx,sy+14,16,2,'#6f7480');
      pr(sx,sy+7,16,1,'#6f7480'); pr(sx+7,sy,1,16,'#7d828d');
    } else if(t==='='){
      pr(sx,sy+2,16,12,'#b07a43'); pr(sx,sy+2,16,2,'#cf9c63'); pr(sx,sy+12,16,2,'#86592e');
      pr(sx+3,sy+5,1,6,'#86592e'); pr(sx+9,sy+5,1,6,'#86592e');
    }
  }

  function drawTiles(){
    const startTx = Math.floor(camX/TILE);
    const endTx = Math.min(LW-1, startTx + VW/TILE + 1);
    for(let tx=startTx;tx<=endTx;tx++){
      for(let ty=0;ty<LH;ty++){
        const t=grid[ty][tx];
        if(t===' '||t==='o') continue;
        let off=0;
        const b=bumps.find(b=>b.tx===tx&&b.ty===ty);
        if(b){ off = -Math.sin(b.t/10*Math.PI)*5; }
        drawTile(t, tx*TILE - camX, ty*TILE, tx, ty, off);
      }
    }
  }

  function drawCoin(c){
    const x=Math.round(c.x-camX), y=Math.round(c.y);
    const w = Math.max(2, Math.round(Math.abs(Math.cos(c.anim))*7)+1);
    const cx = x+4;
    pr(cx-w/2, y, w, 12, C.gold);
    pr(cx-w/2, y, w, 2, C.goldHi);
    pr(cx-w/2, y+10, w, 2, C.goldSh);
    if(w>4){ pr(cx-1, y+3, 2, 6, C.goldSh); pr(cx-1+1, y+3,1,6,C.goldHi); }
  }

  function drawPot(it){
    const x=Math.round(it.x-camX), y=Math.round(it.y) + Math.round(Math.sin(it.t*0.2)*1);
    // steam
    pr(x+3,y-4,2,2,'rgba(255,255,255,.7)'); pr(x+8,y-6,2,2,'rgba(255,255,255,.6)');
    // pot
    pr(x,y+2,12,9,'#3a3a42'); pr(x,y+2,12,2,'#55555f'); pr(x,y+9,12,2,'#26262c');
    pr(x+2,y,8,2,'#7a4a2a'); // contents
    pr(x-1,y+4,1,3,'#26262c'); pr(x+12,y+4,1,3,'#26262c'); // handles
    pr(x+3,y+5,2,2,'#e0a85c'); pr(x+7,y+5,2,2,'#c98a3f'); // bits
  }

  // sumo sprite (local coords, box 16x18). Caller sets transform.
  function sumoLocal(walk, big, blink, isEnemy){
    const sk=isEnemy?C.enSkin:C.skin, sksh=isEnemy?C.enSkinSh:C.skinSh;
    const belt=isEnemy?C.enBelt:C.belt, beltsh=isEnemy?C.enBeltSh:C.beltSh;
    const b=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };
    // topknot / hair
    b(6,0,4,2,C.dark); b(5,1,6,2,C.dark);
    // head
    b(5,2,6,1,sk); b(4,3,8,5,sk);
    b(4,2,1,2,C.dark); b(11,2,1,2,C.dark); // sideburns
    // eyes
    const open = (blink>4);
    if(isEnemy){ b(5,3,3,1,C.dark); b(9,3,3,1,C.dark); } // angry brows
    b(6,5,1, open?2:1, C.eye); b(9,5,1, open?2:1, C.eye);
    // blush
    b(5,6,1,1,C.blush); b(10,6,1,1,C.blush);
    // mouth
    b(7,6,2,1,sksh);
    // body
    b(3,8,10,1,sk); b(2,9,12,5,sk); b(3,14,10,1,sk);
    b(11,9,2,5,sksh);
    // arms
    b(0,9,2,4,sk); b(14,9,2,4,sk); b(0,12,2,1,sksh); b(14,12,2,1,sksh);
    // belt (mawashi)
    b(2,11,12,2,belt); b(2,13,12,1,beltsh);
    if(big){ /* rope highlight handled by caller scale; add tsuna line */ b(2,11,12,1,C.rope); }
    // sagari
    b(6,14,1,2,C.white); b(8,14,1,2,C.white);
    // legs
    const f = walk?1:0;
    b(3,15, 3, 3-f, sk); b(10,15, 3, 3- (1-f), sk);
    b(3,17- (1-f),3,1,C.dark); b(10,17-f,3,1,C.dark);
  }

  function drawSumoEntity(e, big, isEnemy, walk, blink, alpha){
    const sx = Math.round(e.x - camX - (big?4:2));
    const sy = Math.round(e.y - 3);
    const s = big?1.5:1;
    ctx.save();
    if(alpha!==undefined) ctx.globalAlpha=alpha;
    ctx.translate(sx, sy);
    if(e.dir<0){ ctx.translate(16*s,0); ctx.scale(-s,s); } else { ctx.scale(s,s); }
    sumoLocal(walk, big, blink, isEnemy);
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function drawEnemy(e){
    if(!e.alive){
      if(e.fly){ drawSumoEntity(e,false,true, 0, 10, 0.9); return; }
      if(e.squash>0){ // squashed pancake
        const sx=Math.round(e.x-camX), sy=Math.round(e.y+e.h-5);
        pr(sx,sy,e.w,5,C.enBelt); pr(sx,sy,e.w,2,C.enSkin); 
      }
      return;
    }
    const walk = (Math.floor(performance.now()/180)%2)===0;
    drawSumoEntity(e,false,true, walk?1:0, 10, 1);
  }

  function drawPlayer(){
    const p=player;
    if(p.dead){ drawSumoEntity(p,p.big,false, 0, 10, 1); return; }
    if(p.invuln>0 && Math.floor(p.invuln/4)%2===0 && !p.win) return; // flash
    const walk = (Math.sin(p.walk)>0)?1:0;
    const onAir = !p.onGround;
    drawSumoEntity(p, p.big, false, onAir?1:walk, p.blink<150?10:0, 1);
    // dash effect
    if(p.dashT>0){
      const sx=Math.round(p.x-camX), sy=Math.round(p.y);
      ctx.fillStyle='rgba(255,210,120,.5)';
      for(let i=1;i<=3;i++) ctx.fillRect(sx - p.dir*i*4, sy+4, 3, p.h-6);
    }
  }

  function drawGoal(){
    const gx = goalX*TILE - camX;
    // pole
    pr(gx, 16, 3, 11*TILE-16, '#cdb27a'); pr(gx,16,1,11*TILE-16,'#e6cf9b');
    // top ball (軍配 vibe)
    pr(gx-3,12,9,6,'#d23b2e'); pr(gx-3,12,9,2,'#f06a5c');
    // banner のぼり
    const wave = Math.sin(performance.now()/200)*2;
    ctx.fillStyle='#f7f1e3';
    ctx.beginPath();
    ctx.moveTo(gx+3,28); ctx.lineTo(gx+34,28+wave); ctx.lineTo(gx+26,40); ctx.lineTo(gx+34,52+wave); ctx.lineTo(gx+3,52); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#d23b2e'; ctx.fillRect(gx+9,33,3,3); ctx.fillRect(gx+15,33,3,3); ctx.fillRect(gx+12,38,3,3);
    // base dohyo
    pr(gx-12,11*TILE-2,30,4,'#caa46a');
  }

  function drawParticles(){
    for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--; ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x-camX),Math.round(p.y),p.sz,p.sz); }
    particles=particles.filter(p=>p.life>0);
    ctx.fillStyle='#b5562b';
    for(const d of brokenDebris){ d.x+=d.vx; d.y+=d.vy; d.vy+=0.3; d.life--; ctx.fillRect(Math.round(d.x-camX),Math.round(d.y),5,5); }
    brokenDebris=brokenDebris.filter(d=>d.life>0 && d.y<VH+20);
  }

  function render(){
    drawBG();
    drawTiles();
    for(const c of coins){ if(!c.taken) drawCoin(c); }
    for(const it of items){ if(it.type==='pot') drawPot(it); }
    for(const e of enemies) drawEnemy(e);
    drawGoal();
    drawPlayer();
    drawParticles();
    drawPetals();
    if(winFlash>0){ ctx.fillStyle='rgba(255,255,255,'+(0.12)+')'; ctx.fillRect(0,0,VW,VH); }
  }

  // ---------- HUD ----------
  const el = id=>document.getElementById(id);
  function pad(n,w){ n=Math.max(0,Math.floor(n)); let s=''+n; while(s.length<w)s='0'+s; return s; }
  function updateHUD(){
    el('hScore').textContent=pad(score,6);
    el('hCoins').textContent=pad(coinCount%100,2);
    el('hLives').textContent='×'+Math.max(0,lives);
    el('hTime').textContent=pad(stageTime,3);
    el('hStage').textContent='1-1';
  }
  function show(id,on){ el(id).classList.toggle('hidden',!on); }

  // ---------- loop ----------
  let last=0;
  function frame(ts){
    requestAnimationFrame(frame);
    if(!last) last=ts; let dt=(ts-last)/16.6667; last=ts;
    if(dt>3) dt=3; // clamp

    if(state==='play'){
      // step (simple single step; dt clamp keeps stable)
      clearTop();
      updatePlayer();
      updateEnemies();
      updateItems();
      updateCoins();
      // bumps timer
      for(const b of bumps) b.t--; bumps=bumps.filter(b=>b.t>0);
      // timer
      if(!player.win && !player.dead){
        timeAcc += dt;
        if(timeAcc>=24){ timeAcc=0; stageTime--; if(stageTime<=0){ stageTime=0; killPlayer(true); } }
      }
      updateHUD();
    }
    render();
  }
  requestAnimationFrame(frame);

  // buttons
  el('btnStart').addEventListener('click', ()=>{ ensureAudio(); startGame(); });
  el('btnRetry').addEventListener('click', ()=>{ ensureAudio(); startGame(); });
  el('btnNext').addEventListener('click', ()=>{ ensureAudio(); startGame(); });

  // init render a title backdrop
  buildLevel(); player=makePlayer(); enemies=[];coins=[];items=[];particles=[];bumps=[];brokenDebris=[];score=0;lives=3;coinCount=0;stageTime=300;
  camX=0;
})();
</script>
</body>
</html>
